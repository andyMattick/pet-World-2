 G.recaptureUsed=true;G.pendingRecapture=true;G.recaptureTarget=k;G.recaptureResumePhase=phase;G.ph="recapture";render();

 },false,true);
}

 raids.forEach(k=>{T[k].co=0;if(!G.capitalQueue.includes(k))G.capitalQueue.push(k);msg(`🔥 Rebels overran the capital of ${T[k].n}; the state remains yours.`)});

}

function pick(k){

}
function fight(a,d){
 let at=a.t,dt=d.t,la=0,ld=0;const rd=[],dice=n=>Array.from({length:n},()=>1+rnd(6)).sort((p,q)=>q-p);
 while(at>1&&dt>0){const x=Math.min(3,at-1),y=Math.min(2,dt),A=dice(x),D=dice(y),r=[];
  for(let i=0;i<Math.min(x,y);i++){if(A[i]>D[i]){dt--;ld++;r.push(1)}else{at--;la++;r.push(0)}}rd.push([A,D,r])}
 if(dt<=0){const mv=Math.max(1,Math.floor((at-1)/2));a.t=at-mv;d.t=mv;return[true,la,ld,rd]}
 a.t=at;d.t=dt;return[false,la,ld,rd];
}
function addRep(t,rd){G.rep.unshift({t,rd});G.rep=G.rep.slice(0,4)}
function seize(){
 if(G.busy||G.over||!G.sel)return;const q=T[G.sel];if(q.o!=1||q.co==1)return;
 if(q.co==0){if(!G.capitalQueue.includes(q.k))G.capitalQueue.push(q.k);const phase=G.ph;offerRecapture(()=>render(),phase,q.k);return}
 ask(`🏛️ Name the capital of ${q.n} to seize it!`,q.c,CAPS,ok=>{
  if(ok){q.co=1;msg(`🏛️ You seized ${q.c}!`)}else{q.t=Math.max(1,q.t-1);miss(q.n+" (capital: "+q.c+")");msg(`❌ The capital is ${q.c}. -1 troop.`)}render()});
}
function free(){
 if(G.busy||G.slots<=0||G.over)return;
 const v=norm($("fi").value);if(!v)return;
 const k=keys.find(x=>norm(T[x].n)==v);G.slots--;
 if(k&&T[k].o==1&&!G.named.has(k)){G.named.add(k);T[k].t+=4;msg(`✅ ${T[k].n} is yours! +4 troops`)}
 else if(k&&T[k].o==1)msg("You already named that one this turn. No troops.");
 else msg(k?"❌ You don't own that state. Lost a reinforcement.":"❌ That's not a state name. Lost a reinforcement.");
 render();
}
function buy(){
 if(G.gold<3){msg("You need 3 🪙.");render();return}
 const b=keys.filter(k=>T[k].o==1).sort((x,y)=>[...T[x].adj].filter(z=>T[z].o!=1).length*-1+[...T[y].adj].filter(z=>T[z].o!=1).length-0||T[x].t-T[y].t);
 const k=keys.filter(k=>T[k].o==1).sort((x,y)=>T[x].t-T[y].t)[0];
 G.gold-=3;T[k].t+=2;msg(`🪖 Bought 2 troops for ${T[k].n}.`);render();
}
function endTurn(){
 if(G.busy||G.over)return;
 G.sel=null;rebels(computerTurn);
}
function computerTurn(){
 G.ph="ai";const mine=()=>keys.filter(k=>T[k].o==2);
 let reinforcements=Math.floor(mine().length/3)*3;
 while(reinforcements-->0&&mine().length)T[mine()[rnd(mine().length)]].t++;
 msg(`🟥 Computer reinforced with ${Math.floor(keys.filter(k=>T[k].o==2).length/3)*3} troops.`);
 let attacks=0;
 while(attacks<50){
  const candidates=[];
  mine().forEach(k=>{if(T[k].t>=3)T[k].adj.forEach(x=>{if(T[x].o!=2&&T[k].t>T[x].t+1)candidates.push([k,x])})});
  if(!candidates.length)break;
  const humanTargets=candidates.filter(([,target])=>T[target].o==1),choices=humanTargets.length?humanTargets:candidates,[from,target]=choices[rnd(choices.length)];
  const[w,la,ld,rd]=fight(T[from],T[target]);
  if(T[target].o==1)addRep(`🟥 Computer attacks ${T[target].n} from ${T[from].n}`+(w?" — captured!":" — you held!"),rd);
  if(w){if(T[target].o==1)msg(`🟥 The computer captured ${T[target].n}!`);T[target].o=2;T[target].co=2}
  attacks++;
 }
 msg(`🟥 The computer's turn is over.`);
 check();
 if(!G.over){G.turn++;startTurn()}else render();
}
function render(){
 const c=o=>keys.filter(k=>T[k].o==o).length,col=["#9a9a9a","#2f6fdd","#d1495b"];
 let s="",b="";const tg=G.ph=="attack"&&G.sel?T[G.sel].adj:new Set();
 keys.forEach(k=>{
  const t=T[k],cl=k==G.sel?"sel":(tg.has(k)&&t.o!=1?"tg":"");
  s+=`<path data-s="${k}" d="${t.d}" fill="${col[t.o]}" class="${cl}"/>`;
  const x=t.bx!=null?t.bx:t.cx,y=t.by!=null?t.by:t.cy;
  if(t.bx!=null&&k!="HI")s+=`<line x1="${t.cx}" y1="${t.cy}" x2="${x}" y2="${y}" stroke="#555"/>`;
  b+=`<g data-s="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="11" fill="${col[t.o]}" stroke="${k==G.sel?"#ffd43b":"#fff"}" stroke-width="${k==G.sel?3:1.5}"/><text x="${x}" y="${y+4}">${t.t}</text>${G.names?`<text x="${x}" y="${y+23}" style="fill:#123;font-size:9px">${k}</text>`:""}</g><text x="${x+15}" y="${y-6}" style="fill:${col[t.co]};font-size:17px;stroke:#fff;stroke-width:2.5;paint-order:stroke">★</text>`});
 $("map").innerHTML=s+b;
 $("hud").innerHTML=`<span>🟦 You ${c(1)}</span><span>🟥 Computer ${c(2)}</span><span>⬜ Rebels ${c(0)}</span><span>★ You hold ${keys.filter(k=>T[k].co==1).length} capitals</span><span>🪙 ${G.gold}</span><span>Turn ${G.turn}</span>`;
 let h="";
 if(G.over){
  const m=Object.entries(G.miss).sort((x,y)=>y[1]-x[1]).slice(0,10);
  h=`<h3>${G.over=="win"?"🏆 You conquered all 50 states!":"💀 You lost your last state."}</h3><b>📊 Your weak spots:</b><br>${m.length?m.map(x=>`${x[0]} ×${x[1]}`).join("<br>"):"None, perfect!"}<br><button class="g" onclick="init()">Play again</button>`;
 }else if(G.ph=="recapture"){
  h=`<b>🏛️ Reclaim a capital</b><br>Name the rebel-held capital to restore control. You may attempt one recapture per round.`;
 }else if(G.ph=="reinf"){
  h=`<b>1️⃣ Reinforce</b> (${G.slots} slot${G.slots==1?"":"s"} left; you get 2 + 1 for every 10 states and capitals you own${G.slotNote?" — this turn: "+G.slotNote:""})<br>Tap one of your blue states and name it, or type any state you own:<br><input id="fi" placeholder="Type a state you own" onkeydown="if(event.key=='Enter')free()"><button onclick="free()">Go (4 🪖)</button><br><button onclick="buy()">🪖 Buy 2 troops (3 🪙)</button><button class="g" onclick="G.ph='attack';G.sel=null;render()">To battle ➜</button>`;
 }else{
  h=`<b>2️⃣ Attack</b><br>Tap your state (2+ troops), then a neighboring red or gray state, and name it to invade. You earn 🪙 each turn from capitals you hold (★). 🏛️ Conquest capital bonus: ${G.bonusT?"used this turn":"available"}.<br>${G.sel&&T[G.sel].o==1&&T[G.sel].co!=1&&!(T[G.sel].co==0&&G.recaptureUsed)?`<button class="g" onclick="seize()">🏛️ ${T[G.sel].co==0?"Reclaim":"Seize"} ${T[G.sel].n}'s capital</button>`:""}<button class="r" onclick="endTurn()">End turn ➜</button>`;
 }
 h+=`<br><button onclick="G.names=!G.names;render()" style="background:#777">👁 Show names: ${G.names?"on":"off"}</button><br><button onclick="save();msg('💾 Saved. The game also saves automatically.');render()">💾 Save</button><button onclick="exportSave()">📋 Export</button><button onclick="importSave()">📥 Import</button><button class="r" onclick="newGame()">🔄 New game</button>`;
 $("ctl").innerHTML=h;
 const dc=n=>"⚀⚁⚂⚃⚄⚅"[n-1],rp=$("rep");rp.style.display=G.rep.length?"block":"none";
 rp.innerHTML="<small>🎲 Attacker dice vs defender dice. ✅ attacker wins that pair, ❌ defender wins (ties go to the defender).</small>"+G.rep.map(b=>`<hr><b>${b.t}</b>`+b.rd.map((r,i)=>`<div>R${i+1}: <span class="dice">${r[0].map(dc).join("")}</span> vs <span class="dice">${r[1].map(dc).join("")}</span> ${r[2].map(x=>x?"✅":"❌").join("")}</div>`).join("")).join("");
 $("log").innerHTML=G.log.map(x=>`<div>${x}</div>`).join("");
 if(G.over)clearSaved();else if(!G.busy)save();
}
$("map").onclick=e=>{const g=e.target.closest("[data-s]");if(g)pick(g.dataset.s)};
const KEY="stateConquestSave1";
function snap(){const g={...G,named:[...G.named],bonusU:[...G.bonusU],protectedCaps:[...G.protectedCaps]};delete g.busy;return JSON.stringify({v:1,g,t:Object.fromEntries(keys.map(k=>[k,[T[k].o,T[k].co,T[k].t]]))})}
function restore(j){const d=JSON.parse(j);if(d.v!=1||!d.g||!d.t)throw 0;keys.forEach(k=>{if(!d.t[k])throw 0});
 G={...d.g,named:new Set(d.g.named||[]),bonusU:new Set(d.g.bonusU||[]),protectedCaps:new Set(d.g.protectedCaps||[]),capitalAttempts:d.g.capitalAttempts||{},capitalQueue:Array.isArray(d.g.capitalQueue)?d.g.capitalQueue:[],recaptureUsed:!!d.g.recaptureUsed,pendingRecapture:!!d.g.pendingRecapture,recaptureTarget:d.g.recaptureTarget||null,recaptureResumePhase:d.g.recaptureResumePhase||null,busy:false};if(G.ph==="ai")G.ph="computer";keys.forEach(k=>{const a=d.t[k];T[k].o=a[0];T[k].co=a[1];T[k].t=a[2]})}
const embedded=window.parent!==window, arcadeRun=new URLSearchParams(location.search).get('arcadeRun');
function save(){const state=snap();if(embedded&&arcadeRun){window.parent.postMessage({type:"arcade:state-save",gameId:"state-conquest",runId:arcadeRun,state},location.origin);return}try{localStorage.setItem(KEY,state)}catch(e){}}
function clearSaved(){if(embedded&&arcadeRun){window.parent.postMessage({type:"arcade:state-clear",gameId:"state-conquest",runId:arcadeRun},location.origin);return}try{localStorage.removeItem(KEY)}catch(e){}}
function loadSaved(){if(embedded)return null;try{return localStorage.getItem(KEY)}catch(e){return null}}
function dlg(h){const m=$("md");m.style.display="flex";m.innerHTML=`<div class="mc">${h}</div>`}
function closeDlg(){$("md").style.display="none"}
function resume(){
 render();
 if(G.pendingRecapture&&G.recaptureTarget){const phase=G.recaptureResumePhase||"reinf",target=G.recaptureTarget;G.pendingRecapture=false;G.recaptureUsed=false;offerRecapture(()=>phase==="computer"?computerTurn():render(),phase,target)}
 else if(G.ph==="computer")computerTurn();
 else if(G.ph==="rebels")rebels(computerTurn);
}
function exportSave(){const c=btoa(unescape(encodeURIComponent(snap())));dlg(`<b>📋 Your save code</b><p>Copy it and keep it somewhere safe. You can paste it with Import, even on another device.</p><textarea id="ec" rows="5" style="width:100%" readonly>${c}</textarea><p><button onclick="$('ec').select()">Select all</button><button onclick="closeDlg()">Close</button></p>`)}
function importSave(){dlg(`<b>📥 Paste your save code</b><p><textarea id="ic" rows="5" style="width:100%"></textarea></p><button class="g" onclick="doImport()">Load</button><button onclick="closeDlg()">Cancel</button>`)}
function doImport(){try{restore(decodeURIComponent(escape(atob($("ic").value.trim()))));save();closeDlg();resume()}catch(e){$("ic").value="";$("ic").placeholder="That code didn't work."}}
function newGame(){dlg(`<b>Start a new game?</b><p>Your current game will be replaced.</p><button class="r" onclick="closeDlg();init()">Yes, new game</button><button onclick="closeDlg()">Cancel</button>`)}
function offerSavedGame(sv){
 if(sv){let t="?";try{t=JSON.parse(sv).g.turn}catch(e){}
  dlg(`<b>💾 Saved game found (turn ${t})</b><p><button class="g" id="co">Continue</button><button class="r" onclick="closeDlg();init()">New game</button></p>`);
  $("co").onclick=()=>{try{restore(sv);closeDlg();resume()}catch(e){closeDlg();init()}};
 }else init();
}
if(embedded&&arcadeRun){
 window.addEventListener('message',e=>{const d=e.data;if(e.source!==window.parent||e.origin!==location.origin||!d||d.type!=="arcade:state-load"||d.gameId!=="state-conquest"||d.runId!==arcadeRun)return;if(d.state){try{restore(d.state);resume()}catch(e){init()}}else init()});
 window.parent.postMessage({type:"arcade:state-load-request",gameId:"state-conquest",runId:arcadeRun},location.origin);
}else offerSavedGame(loadSaved());
</script></body></html>
