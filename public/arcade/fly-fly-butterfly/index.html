    if(i<NODES.length-1) html += '<div class="lc-arrow">&rarr;</div>';
  });
  html += '</div></div>';
  return html;
}

function renderTracks(indices){
  indices = indices || [0,1,2,3];
  let html = '<div class="tracks">';
  indices.forEach((idx)=>{
    const t = G.tracks[idx];
    const eligible = trackEligibility(t);
    const selectableForReverse = !G.selectedCardId && !t.locked;
    const trackSelected = (G.selectedTrackIdx===idx);
    const curDisplayIdx = t.stageIndex+1; // 0..(ADULT_STAGE_INDEX+1) within NODES
    const fillPct = Math.max(0, t.stageIndex) / ADULT_STAGE_INDEX * 100;
    let nodesHtml = '';
    NODES.forEach((nd,ni)=>{
      let cls='node';
      if(ni < curDisplayIdx) cls+=' done';
      if(ni === curDisplayIdx) cls+=' current';
      const art = nodeArt(ni);
      const label = nd.key + (ni===SECOND_FEED_NODE_INDEX ? ' (2nd feeding)' : '');
      nodesHtml += '<div class="'+cls+'" style="--stage-color:'+nd.color+'" title="'+esc(label)+'"><svg viewBox="0 0 64 64" fill="currentColor">'+art+'</svg></div>';
    });
    const curLabel = t.stageIndex===-1 ? 'Egg' : STAGES[t.stageIndex].key;
    const tierSplitPct = (BABY_STAGE_INDEX+1)/(NODES.length-1)*100;
    const contribList = t.contrib ? Object.keys(t.contrib).map(k=>{
      const pid = parseInt(k,10);
      return {name:G.players[pid].name, mine:pid===G.currentPlayerIndex, tier:t.contrib[k]};
    }) : [];
    const touchedThisTurn = !G.finalRound && !!(G.turnContrib && G.turnContrib[idx]);
    const clickAct = eligible ? 'playOnTrack' : (selectableForReverse ? 'selectTrack' : '');
    html += '<div class="track'+(eligible?' eligible':'')+(selectableForReverse?' selectable':'')+(trackSelected?' track-selected':'')+(t.locked?' locked':'')+'" title="Track '+(idx+1)+': currently at '+esc(curLabel)+(t.locked?' (locked, already scored)':'')+'" data-act="'+clickAct+'" data-track="'+idx+'">' +
      '<div class="t-head">' +
        '<div><div class="t-label">Track '+(idx+1)+'</div><div class="t-sub">'+esc(curLabel).toUpperCase()+'</div></div>' +
        (t.locked?'<div class="lock-badge">&#128274; SCORED</div>':'') +
      '</div>' +
      '<div class="nodewrap">' +
        '<div class="line-bg"></div>' +
        '<div class="line-fill" style="width:'+fillPct+'%"></div>' +
        '<div class="nodes">'+nodesHtml+'</div>' +
      '</div>' +
      '<div class="tier-track-row">' +
        '<div class="tier-seg tier-seg-1" style="width:'+tierSplitPct+'%">TIER 1</div>' +
        '<div class="tier-seg tier-seg-2" style="width:'+(100-tierSplitPct)+'%">TIER 2</div>' +
      '</div>' +
      '<div class="t-meta">' +
        contribList.map(c=>'<span class="t-credit'+(c.mine?' mine':'')+'">'+esc(c.name)+': '+c.tier+'</span>').join('') +
        (touchedThisTurn ? '<span class="t-touched">Played this turn</span>' : '') +
      '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

function renderHand(playerIdx, opts){
  opts = opts||{};
  const player = G.players[playerIdx];
  if(player.hand.length===0){
    return '<div class="hand-wrap"><div class="hand-scroller"><span style="font-size:12px;color:var(--cream-dim);padding:10px;">No cards in hand.</span></div></div>';
  }
  let html = '<div class="hand-wrap"><div class="hand-scroller">';
  player.hand.forEach(c=>{
    let cardOpts = opts;
    if(opts.highlightForTrack!==undefined && opts.highlightForTrack!==null){
      const track = G.tracks[opts.highlightForTrack];
      cardOpts = Object.assign({}, opts, { eligible: !!actionForCardOnTrack(c, track) });
    }
    html += renderCard(c, cardOpts);
  });
  html += '</div></div>';
  return html;
}

function renderResultsModal(){
  if(!showResults) return '';
  let html = '<div class="rules-modal" data-act="closeResultsBg">' +
    '<div class="inner">' +
      '<h3>&#128202; Results</h3>';

  if(!hasStorage() && !arcadeEmbedded){
    html += '<p>Results tracking needs the artifact storage feature, which isn\'t available in this preview environment. Everything else still works.</p>';
  } else if(!historyLoaded){
    html += '<p>Loading saved results&hellip;</p>';
  } else {
    if(simSummary){
      html += '<p style="color:var(--gold);">Just simulated '+simSummary.completed+' of '+simSummary.n+' requested game'+(simSummary.n===1?'':'s')+'.</p>';
    }
    if(matchHistory.length===0){
      html += '<p>No games recorded yet. Finish a game, or run an instant simulation from the setup screen, to start building test data.</p>';
    } else {
      const totalGames = matchHistory.length;
      const aiWins = matchHistory.filter(r=>r.winnerIsAI).length;
      const avgTotal = Math.round(matchHistory.reduce((s,r)=>s+r.winnerTotal,0)/totalGames);
      const avgButterflies = (matchHistory.reduce((s,r)=>s+(r.butterfliesScored||0),0)/totalGames).toFixed(1);
      const kidsCount = matchHistory.filter(r=>r.mode==='kids').length;
      const losingTotals = matchHistory.map(r=> r.players && r.players.length ? Math.min(...r.players.map(p=>p.total)) : r.winnerTotal);
      const avgLosing = Math.round(losingTotals.reduce((s,v)=>s+v,0)/totalGames);
      const diffs = matchHistory.map((r,i)=> r.winnerTotal - losingTotals[i]);
      const avgDiff = Math.round(diffs.reduce((s,v)=>s+v,0)/totalGames);

      html += '<div class="stat-grid">' +
        '<div class="stat-box"><div class="stat-n">'+totalGames+'</div><div class="stat-l">games recorded</div></div>' +
        '<div class="stat-box"><div class="stat-n">'+avgTotal+'</div><div class="stat-l">avg winning score</div></div>' +
        '<div class="stat-box"><div class="stat-n">'+avgLosing+'</div><div class="stat-l">avg losing score</div></div>' +
        '<div class="stat-box"><div class="stat-n">'+avgDiff+'</div><div class="stat-l">avg score differential</div></div>' +
        '<div class="stat-box"><div class="stat-n">'+avgButterflies+'</div><div class="stat-l">avg Butterflies scored</div></div>' +
        '<div class="stat-box"><div class="stat-n">'+aiWins+'/'+totalGames+'</div><div class="stat-l">won by a Computer</div></div>' +
      '</div>';
      html += '<p style="font-size:11px;color:var(--cream-dim);margin-top:2px;">Kids mode: '+kidsCount+' &middot; Advanced mode: '+(totalGames-kidsCount)+'</p>';

      html += '<div class="history-list">';
      matchHistory.slice(0,25).forEach(r=>{
        const d = new Date(r.timestamp);
        const dateStr = d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const rankedPlayers = r.players.slice().sort((a,b)=>b.total-a.total);
        html += '<div class="history-row">' +
          '<div class="history-head"><span>'+dateStr+'</span><span>'+(r.mode==='kids'?'Kids':'Advanced'+(r.longerGame?' (long)':''))+' &middot; '+r.playerCount+'p</span></div>' +
          '<div class="history-players">' + rankedPlayers.map((p,i)=>
            '<span class="hp'+(i===0?' win':'')+'">'+(p.isAI?'&#129302;':'&#128100;')+' '+esc(p.name)+' <b>'+p.total+'</b></span>'
          ).join('') + '</div>' +
        '</div>';
      });
      html += '</div>';
      html += '<button class="btn btn-ghost btn-sm" data-act="clearHistory" style="margin-top:12px;">Clear all results</button>';
    }
  }

  html += '<button class="btn btn-primary" data-act="closeResults" style="margin-top:14px;display:block;">Close</button>';
  html += '</div></div>';
  return html;
}

function renderOnlineHandAndActions(){
  const pIdx = myPlayerIndex();
  const player = G.players[pIdx];
  const selectedCard = G.selectedCardId ? findCardInHand(pIdx, G.selectedCardId) : null;
  const trackSelected = (G.selectedTrackIdx!==null && G.selectedTrackIdx!==undefined) ? G.selectedTrackIdx : null;

  let html = '<div class="panel">';
  html += '<div class="footer-bar"><h2 style="font-size:16px;">Your hand</h2>' +
    '<span class="pile-info">Draw: '+G.drawPile.length+' &middot; Discard: '+G.discardPile.length+'</span></div>';
  html += renderHand(pIdx, {act:'selectCard', highlightForTrack: trackSelected, showPlayable:true});
  html += '<div class="actionrow">';
  html += '<button class="btn btn-primary" data-act="endTurn" style="margin-left:auto;">End Turn</button>';
  html += '</div>';
  if(selectedCard){
    html += '<div style="font-size:12px;color:var(--cream-dim);margin-top:8px;">Tap a glowing track to play <b>'+esc(cardName(selectedCard))+'</b> there.</div>';
  }
  if(!selectedCard && trackSelected!==null){
    html += '<div style="font-size:12px;color:var(--cream-dim);margin-top:8px;">Glowing cards can be played on Track '+(trackSelected+1)+'. Tap one to play it.</div>';
  }
  if(G.mode==='advanced' && !G.finalRound && !selectedCard && trackSelected===null){
    html += '<div style="font-size:12px;color:var(--cream-dim);margin-top:8px;">Play 0 or 1 cards this turn and an Event triggers automatically when you end your turn.</div>';
  }
  html += '</div>';
  return html;
}

function renderOnlineGame(){
  if(!G) return renderOnlineWaitingBanner('Reconnecting&hellip;');
  if(G.phase==='end') return renderEnd();

  const myIdx = myPlayerIndex();
  let html = '';
  html += '<div class="footer-bar" style="margin-bottom:10px;"><span class="pile-info">Lobby '+esc(O.code||'')+'</span><button class="btn btn-ghost btn-sm" data-act="onlineLeave">Leave Game</button></div>';
  html += renderScoreboard();
  html += renderButterflyTracker();
  html += renderLifeCycleStrip();
  if(G.finalRound){
    html += '<div class="panel" style="border-color:var(--coral);padding:10px 16px;"><b style="color:var(--coral);">Final Round!</b> <span style="font-size:13px;color:var(--cream-dim);">Locked tracks can no longer be played. Score the rest to end the game.</span></div>';
  }
  html += renderTracks([0,1]);

  if(G.phase==='photo-decision' && G.photoQueue[0]){
    if(G.photoQueue[0].playerIndex===myIdx){
      html += renderPhotoDecision();
    } else {
      html += renderOnlineWaitingBanner(G.players[G.photoQueue[0].playerIndex].name + ' is deciding on a photo\u2026');
    }
  } else if(G.phase==='event-choice'){
    if(G.currentPlayerIndex===myIdx){
      html += renderEventChoice();
    } else {
      html += renderOnlineWaitingBanner(G.players[G.currentPlayerIndex].name + ' is resolving an Event\u2026');
    }
  } else if(G.phase==='wild-choice' && G.pendingWildChoice){
    if(G.pendingWildChoice.playerIdx===myIdx){
      html += renderWildChoice();
    } else {
      html += renderOnlineWaitingBanner(G.players[G.pendingWildChoice.playerIdx].name + ' is deciding on a Wild\u2026');
    }
  } else if(G.phase==='play' && G.currentPlayerIndex===myIdx){
    html += renderOnlineHandAndActions();
  } else if(G.phase==='play'){
    html += renderOnlineWaitingBanner((G.players[G.currentPlayerIndex]?G.players[G.currentPlayerIndex].name:'Someone') + "'s turn\u2026");
  } else {
    html += renderOnlineWaitingBanner('Syncing\u2026');
  }

  html += renderTracks([2,3]);
  html += renderLog();
  return html;
}

/* ============================= MASTER RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '<div class="rules-toggle">' +
    '<button class="btn btn-ghost btn-sm" data-act="toggleResults">&#128202; Results</button>' +
    '<button class="btn btn-ghost btn-sm" data-act="toggleRules">&#128220; Rules</button>' +
  '</div>';

  if(appPhase==='setup'){
    html += renderSetup();
  } else if(appPhase==='online'){
    if(O.screen==='choose') html += renderOnlineChoose();
    else if(O.screen==='create') html += renderOnlineCreate();
    else if(O.screen==='join') html += renderOnlineJoin();
    else if(O.screen==='waiting') html += renderOnlineWaiting();
    else if(O.screen==='playing') html += renderOnlineGame();
    else html += renderOnlineChoose();
  } else {
    switch(G.phase){
      case 'gate-turnstart':
      case 'gate-photo':
      case 'gate-resume':
        html += renderGateScreen();
        break;
      case 'play':
        html += renderPlay();
        break;
      case 'photo-decision':
        html += renderPhotoDecision();
        break;
      case 'event-choice':
        html += renderEventChoice();
        break;
      case 'wild-choice':
        html += renderWildChoice();
        break;
      case 'end':
        html += renderEnd();
        break;
      default:
        html += renderPlay();
    }
  }

  html += renderRulesModal();
  html += renderResultsModal();
  if(toastMsg) html += '<div class="toast">'+esc(toastMsg)+'</div>';
  html += renderCelebration();

  app.innerHTML = html;
  saveArcadeProgress();
  maybeAutoAdvance();
  attachHoverHighlighting();
}

// Lets you see where a card can be played (or which cards fit a track) by
// hovering, without clicking anything. Uses direct DOM listeners rather
// than the click-driven re-render, so it's cheap and never loses state.
function attachHoverHighlighting(){
  if(!G || G.phase!=='play') return;
  if(appPhase!=='game' && appPhase!=='online') return;
  const pIdx = appPhase==='online' ? myPlayerIndex() : G.currentPlayerIndex;
  if(appPhase==='online' && (pIdx<0 || G.currentPlayerIndex!==pIdx)) return; // only hover-highlight on your own turn, online
  const player = G.players[pIdx];
  if(!player || player.isAI) return;
  const handScroller = document.querySelector('.hand-wrap .hand-scroller');
  if(!handScroller) return;
  const cardEls = Array.from(handScroller.querySelectorAll('.card[data-id]'));
  const trackEls = Array.from(document.querySelectorAll('.track[data-track]'));
  if(cardEls.length===0 || trackEls.length===0) return;

  cardEls.forEach(cardEl=>{
    const card = findCardInHand(pIdx, cardEl.dataset.id);
    if(!card) return;
    cardEl.addEventListener('mouseenter', function(){
      trackEls.forEach(tEl=>{
        const ti = parseInt(tEl.dataset.track,10);
        if(actionForCardOnTrack(card, G.tracks[ti])) tEl.classList.add('hover-target');
      });
    });
    cardEl.addEventListener('mouseleave', function(){
      trackEls.forEach(tEl=> tEl.classList.remove('hover-target'));
    });
  });

  trackEls.forEach(trackEl=>{
    const ti = parseInt(trackEl.dataset.track,10);
    trackEl.addEventListener('mouseenter', function(){
      cardEls.forEach(cEl=>{
        const card = findCardInHand(pIdx, cEl.dataset.id);
        if(card && actionForCardOnTrack(card, G.tracks[ti])) cEl.classList.add('hover-target');
      });
    });
    trackEl.addEventListener('mouseleave', function(){
      cardEls.forEach(cEl=> cEl.classList.remove('hover-target'));
    });
  });
}

/* ============================= EVENT DELEGATION ============================= */
const ONLINE_SYNC_ACTIONS = new Set(['playOnTrack','endTurn','takePhoto','skipPhoto','lookGrow','pickPeekOpponent','takePeekedCard','finishPeek']);

document.addEventListener('click', function(e){
  if(e.target.tagName==='INPUT' && e.target.type==='text') return; // let normal text-editing clicks through untouched
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const d = el.dataset;

  switch(act){
    case 'setCount': {
      const n = parseInt(d.n,10);
      S.count = n;
      while(S.names.length<n) S.names.push('');
      while(S.types.length<n) S.types.push('human');
      S.names.length = n;
      S.types.length = n;
      break;
    }
    case 'setPlayerType': {
      const i = parseInt(d.i,10);
      S.types[i] = d.type;
      break;
    }
    case 'setMode': S.mode = d.m; break;
    case 'toggleLonger': S.longer = !S.longer; break;
    case 'startGame': startRealGame(); break;
    case 'playAgain': appPhase='setup'; G=null; simSummary=null; break;
    case 'simulate': {
      const n = parseInt(d.n,10);
      simulateGames(n, S.count, S.mode, S.longer);
      break;
    }

    case 'confirmGateTurnstart': confirmGateTurnstart(); break;
    case 'confirmGatePhoto': confirmGatePhoto(); break;
    case 'confirmGateResume': confirmGateResume(); break;

    case 'selectCard': selectCard(d.id); break;
    case 'selectTrack': selectTrack(parseInt(d.track,10)); break;
    case 'playOnTrack': playOnTrack(parseInt(d.track,10)); break;
    case 'endTurn': endTurn(); break;

    case 'togglePhotoCard': togglePhotoCard(d.id); break;
    case 'takePhoto': resolvePhoto(true); break;
    case 'skipPhoto': resolvePhoto(false); break;
    case 'wildChoiceScore': resolveWildChoice('score'); break;
    case 'wildChoiceAdvance': resolveWildChoice('advance'); break;

    case 'lookGrow': resolveLookAtItGrow(parseInt(d.track,10), parseInt(d.dest,10)); break;
    case 'pickPeekOpponent': pickPeekOpponent(parseInt(d.p,10)); break;
    case 'takePeekedCard': takePeekedCard(d.id); break;
    case 'finishPeek': finishPeek(); break;

    case 'toggleRules': showRules = !showRules; break;
    case 'closeRules': showRules = false; break;
    case 'closeRulesBg': if(e.target===el) showRules=false; break;

    case 'toggleResults': showResults = !showResults; break;
    case 'closeResults': showResults = false; simSummary=null; break;
    case 'closeResultsBg': if(e.target===el){ showResults=false; simSummary=null; } break;
    case 'clearHistory': clearHistory(); break;

    case 'onlineGoChoose': appPhase='online'; O.screen='choose'; O.error=null; break;
    case 'onlineBackToSetup': appPhase='setup'; break;
    case 'onlineGoCreate': O.screen='create'; O.error=null; break;
    case 'onlineGoJoin': O.screen='join'; O.error=null; break;
    case 'onlineSetCount': O.count = parseInt(d.n,10); break;
    case 'onlineSetMode': O.mode = d.m; break;
    case 'onlineToggleLonger': O.longer = !O.longer; break;
    case 'onlineCreate': createLobby(); break;
    case 'onlineJoin': joinLobby(); break;
    case 'onlineToggleSeatAI': toggleSeatAI(parseInt(d.i,10)); break;
    case 'onlineStart': startOnlineGame(); break;
    case 'onlineLeave': leaveOnlineGame(); break;
  }

  if(G && G.onlineMode && ONLINE_SYNC_ACTIONS.has(act)){
    pushOnlineState();
  }
  render();
});

document.addEventListener('input', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.act==='setName'){
    const i = parseInt(el.dataset.i,10);
    S.names[i] = el.value;
  } else if(el.dataset.act==='onlineSetName'){
    O.myName = el.value;
  } else if(el.dataset.act==='onlineSetCode'){
    O.joinCodeInput = el.value.toUpperCase();
  }
});

/* ============================= INIT ============================= */
function restoreArcadeProgress(raw){
  try{
    const saved = JSON.parse(raw);
    if(saved.v!==1 || !saved.S || typeof saved.S!=='object') throw 0;
    S = saved.S;
    G = saved.G && !saved.G.onlineMode ? saved.G : null;
    appPhase = saved.appPhase==='game' && G ? 'game' : 'setup';
    if(appPhase==='setup') G = null;
    matchHistory = Array.isArray(saved.matchHistory) ? saved.matchHistory.slice(0,50) : [];
  }catch(e){ G=null; appPhase='setup'; matchHistory=[]; }
  historyLoaded = true;
  render();
}
function saveArcadeProgress(){
  if(!arcadeEmbedded || !arcadeRunId || (G && G.onlineMode)) return;
  try{
    const state = JSON.stringify({v:1,S,G,appPhase,matchHistory:matchHistory.slice(0,50)});
    if(state.length<=95000) window.parent.postMessage({type:'arcade:state-save',gameId:'fly-fly-butterfly',runId:arcadeRunId,state},location.origin);
  }catch(e){}
}
function initializeApp(){
  if(arcadeEmbedded && arcadeRunId){
    window.addEventListener('message',event=>{
      const data=event.data;
      if(event.source!==window.parent || event.origin!==location.origin || !data || data.type!=='arcade:state-load' || data.gameId!=='fly-fly-butterfly' || data.runId!==arcadeRunId) return;
      if(data.state) restoreArcadeProgress(data.state);
      else { historyLoaded=true; render(); }
    });
    window.parent.postMessage({type:'arcade:state-load-request',gameId:'fly-fly-butterfly',runId:arcadeRunId},location.origin);
  }else{
    render();
    loadHistory();
  }
}
initializeApp();
})();
