<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>48 Prepositions: Recall Challenge</title>
<!-- Pet World: served at /prep-recall/. Played from Today's plan while she is in English Unit 5, and from the Arcade the rest of the time. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBF6; --ink:#1F2A44; --rule:#C9DBEE; --margin:#D2455A;
    --hi:#FFE45C; --ok:#237A4B; --muted:#5E6A82; --slot:#FFFFFF; --line:#D9DEE8;
    --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#161B26; --ink:#E8ECF4; --rule:#26324A; --margin:#F06A7C;
      --hi:#E8C93A; --ok:#5BD08F; --muted:#9AA6BD; --slot:#1E2533; --line:#2E384B; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
    color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
    min-height:100vh;
  }
  .wrap{max-width:980px; margin:0 auto; padding:24px 20px 60px 44px; position:relative}
  .wrap::before{content:""; position:absolute; top:0; bottom:0; left:24px; width:2px; background:var(--margin); opacity:.55}
  h1{font-family:var(--display); font-weight:800; font-size:clamp(2rem,5vw,3.1rem); line-height:1.05; margin:8px 0 4px; letter-spacing:-.02em}
  .sub{color:var(--muted); margin:0 0 20px}

  .board{display:grid; grid-template-columns:auto 1fr; gap:18px 28px; align-items:end; margin-bottom:18px}
  .clock{font-family:var(--display); font-weight:700; font-size:clamp(3rem,10vw,5.2rem); line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em}
  .stats{display:flex; gap:22px; flex-wrap:wrap; padding-bottom:8px}
  .stat b{display:block; font-family:var(--display); font-size:1.7rem; line-height:1; font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted); font-size:.9rem}

  .entry{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  #guess{
    flex:1 1 260px; font:inherit; font-size:1.3rem; padding:12px 14px; border-radius:10px;
    border:2px solid var(--ink); background:var(--slot); color:var(--ink);
  }
  #guess:disabled{opacity:.5}
  button{
    font:inherit; font-weight:700; padding:12px 16px; border-radius:10px; cursor:pointer;
    border:2px solid var(--ink); background:transparent; color:var(--ink);
  }
  button.primary{background:var(--ink); color:var(--paper)}
  button:disabled{opacity:.4; cursor:not-allowed}
  button:focus-visible, #guess:focus-visible{outline:3px solid var(--hi); outline-offset:2px}

  #guess.flash-good{border-color:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 35%, transparent)}
  #guess.flash-bad{border-color:var(--margin); box-shadow:0 0 0 4px color-mix(in srgb, var(--margin) 35%, transparent)}
  button.armed{background:var(--margin); border-color:var(--margin); color:#fff}
  @media (prefers-reduced-motion:no-preference){
    #guess{transition:border-color .15s, box-shadow .15s}
    #guess.flash-bad{animation:shake .35s}
    .slot.fresh{animation:pop .45s}
  }
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:50; display:flex; align-items:center; justify-content:center; opacity:0}
  #fx.good{background:color-mix(in srgb, var(--ok) 30%, transparent)}
  #fx.bad{background:color-mix(in srgb, var(--margin) 32%, transparent)}
  #fx.show{animation:fxfade .7s ease-out}
  #fx .stamp{font-family:var(--display); font-weight:800; font-size:clamp(3rem,14vw,8rem); line-height:1; padding:.15em .45em; border-radius:.25em; color:#fff; text-align:center; max-width:90vw; overflow-wrap:anywhere}
  #fx.good .stamp{background:var(--ok)}
  #fx.bad .stamp{background:var(--margin)}
  @keyframes fxfade{0%{opacity:0}12%{opacity:1}65%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:no-preference){
    #fx.show .stamp{animation:stampin .7s cubic-bezier(.2,1.4,.4,1)}
    #fx.bad.show .stamp{animation:stampin .7s cubic-bezier(.2,1.4,.4,1), shake .4s .1s}
  }
  @keyframes stampin{0%{transform:scale(.4)}30%{transform:scale(1.08)}45%{transform:scale(1)}100%{transform:scale(1)}}
  .msg{font-size:1.25rem}
  .msg{min-height:1.6em; margin:4px 0 16px; font-weight:700}
  .toggle{display:inline-flex; gap:8px; align-items:center; color:var(--muted); cursor:pointer; margin:2px 0 4px}
  .toggle input{width:18px; height:18px; accent-color:var(--ink)}
  .msg.good{color:var(--ok)} .msg.bad{color:var(--margin)} .msg.hint{color:var(--ink)}
  .msg.hint mark{background:var(--hi); color:#1F2A44; padding:0 6px; border-radius:4px; font-family:var(--display); font-size:1.2rem}

  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px 12px; margin-bottom:34px}
  .grid.alpha{grid-auto-flow:column; grid-template-rows:repeat(12,auto)}
  .slot{display:flex; gap:8px; align-items:baseline; height:32px; border-bottom:2px solid var(--line); padding:0 2px}
  .slot .n{color:var(--muted); font-size:.8rem; width:1.7em; text-align:right; font-variant-numeric:tabular-nums}
  .slot .w{font-weight:700; font-size:1.05rem}
  .slot.found{border-bottom-color:var(--ok)}
  .slot.found .w{color:var(--ok)}
  .slot.fresh .w{background:var(--hi); color:#1F2A44; border-radius:4px; padding:0 4px}
  .slot.missed{border-bottom-color:var(--margin)}
  .slot.missed .w{color:var(--margin); font-style:italic}

  h2{font-family:var(--display); font-size:1.6rem; margin:0 0 6px}
  .histhead{display:flex; justify-content:space-between; align-items:end; gap:12px; flex-wrap:wrap; margin-bottom:10px}
  .histhead .actions{display:flex; gap:8px}
  .histhead button{padding:8px 12px; font-size:.9rem}
  .best{color:var(--muted); margin:0 0 10px}
  .tablewrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; background:var(--slot); border:2px solid var(--line); border-radius:10px; overflow:hidden}
  th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
  th{font-size:.85rem; color:var(--muted); font-weight:700}
  td.num{font-variant-numeric:tabular-nums}
  td.notes{white-space:normal; font-size:.9rem; color:var(--muted); min-width:220px}
  tr.pb td:first-child::after{content:" ★"; color:var(--margin)}
  .empty{padding:16px; color:var(--muted)}

  @media (max-width:760px){ .grid{grid-template-columns:repeat(2,1fr)} .grid.alpha{grid-template-rows:repeat(24,auto)} .board{grid-template-columns:1fr} }
  @media (max-width:420px){ .wrap{padding-left:34px} .wrap::before{left:16px} }
  @media (prefers-reduced-motion:no-preference){ .slot.fresh .w{transition:background .6s} }
</style>
</head>
<body>
<div id="fx" aria-hidden="true"><div class="stamp" id="fxText"></div></div>
<div class="wrap">
  <h1>Name all 48 prepositions</h1>
  <p class="sub">Type one and it fills the next blank, in any order. Press Enter for short words like <em>in</em> or <em>to</em> that start a longer one.</p>

  <div class="board">
    <div class="clock" id="clock" aria-live="off">0:00.0</div>
    <div class="stats">
      <div class="stat"><b id="sFound">0</b><span>of 48 found</span></div>
      <div class="stat"><b id="sWrong">0</b><span>wrong</span></div>
      <div class="stat"><b id="sHints">0</b><span>hints</span></div>
    </div>
  </div>

  <div class="entry">
    <input id="guess" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Press Start, then type a preposition" disabled aria-label="Type a preposition">
    <button class="primary" id="btnStart">Start</button>
    <button id="btnHint" disabled>Hint</button>
    <button id="btnGiveUp" disabled>Give up</button>
  </div>
  <label class="toggle"><input type="checkbox" id="alpha"> Alphabetical blanks (shows where each word goes, so it's easier)</label>
  <label class="toggle" style="margin-left:18px"><input type="checkbox" id="sound" checked> Sound</label>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="grid" id="grid"></div>

  <section>
    <div class="histhead">
      <div>
        <h2>Your games</h2>
        <p class="best" id="best">Finish a game to set a best time.</p>
      </div>
      <div class="actions">
        <button id="btnCsv">Download CSV</button>
        <button id="btnClear">Clear history</button>
      </div>
    </div>
    <div class="tablewrap"><div id="history"></div></div>
  </section>
</div>

<script>
const WORDS = ["aboard","about","above","across","after","against","along","amid","among","around","at","before","behind","below","beneath","beside","between","beyond","but","by","down","during","except","for","from","in","into","like","near","of","off","on","over","past","since","through","throughout","to","toward","under","underneath","until","unto","up","upon","with","within","without"];
const KEY = "prep48_history_v1";

const $ = id => document.getElementById(id);
const grid=$("grid"), guess=$("guess"), msg=$("msg"), clock=$("clock");

let found, order, usedAlpha, wrong, wrongWords, hints, startTime, timerId, running=false, finished=false;
const PREF="prep48_alpha";
const alphaBox=$("alpha");
try{ alphaBox.checked = localStorage.getItem(PREF)==="1"; }catch(e){}

function renderGrid(fresh){
  const alpha=alphaBox.checked;
  grid.classList.toggle("alpha", alpha);
  const missed = finished ? WORDS.filter(w=>!found.has(w)) : [];
  const seq = alpha ? WORDS : [...order, ...missed];
  grid.innerHTML = WORDS.map((_,i)=>{
    const w=seq[i]; let cls="slot", txt="";
    if(w && found.has(w)){ cls+=" found"; txt=w; if(w===fresh) cls+=" fresh"; }
    else if(w && finished){ cls+=" missed"; txt=w; }
    return `<div class="${cls}"><span class="n">${i+1}</span><span class="w">${txt}</span></div>`;
  }).join("");
  if(fresh) setTimeout(()=>{ const f=grid.querySelector(".fresh"); if(f) f.classList.remove("fresh"); },900);
}
function fmt(ms){
  const t=Math.floor(ms/100), m=Math.floor(t/600), s=Math.floor((t%600)/10), d=t%10;
  return `${m}:${String(s).padStart(2,"0")}.${d}`;
}
function tick(){ clock.textContent = fmt(Date.now()-startTime); }
function updateStats(){
  $("sFound").textContent=found.size; $("sWrong").textContent=wrong; $("sHints").textContent=hints;
}
function say(text, cls){ msg.className="msg "+(cls||""); msg.innerHTML=text; }

// Feedback: sounds via Web Audio (no files needed) + input flash
let actx=null;
function tone(freq, start, dur, type, vol){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
function play(kind){
  if(!$("sound").checked) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    if(kind==="good"){ tone(660,0,0.12,"sine",0.25); tone(990,0.08,0.18,"sine",0.25); }
    else if(kind==="bad"){ tone(160,0,0.28,"square",0.12); }
    else if(kind==="win"){ [523,659,784,1047].forEach((f,i)=>tone(f,i*0.12,0.3,"triangle",0.25)); }
  }catch(e){}
}
function bigCue(kind, text){
  const fx=$("fx");
  $("fxText").textContent=text;
  fx.className=kind; void fx.offsetWidth; fx.className=kind+" show";
  clearTimeout(bigCue.t); bigCue.t=setTimeout(()=>{ fx.className=""; },750);
}
function flash(kind){
  guess.classList.remove("flash-good","flash-bad"); void guess.offsetWidth;
  guess.classList.add("flash-"+kind);
  clearTimeout(flash.t); flash.t=setTimeout(()=>guess.classList.remove("flash-"+kind),450);
}

// Tap-twice confirm (pop-up dialogs get blocked in some previews)
function armed(btn, prompt, action){
  if(btn.dataset.armed){ clearTimeout(btn._t); disarm(btn); action(); return; }
  btn.dataset.label=btn.textContent; btn.dataset.armed="1";
  btn.textContent=prompt; btn.classList.add("armed");
  btn._t=setTimeout(()=>disarm(btn),3000);
}
function disarm(btn){
  if(!btn.dataset.armed) return;
  btn.textContent=btn.dataset.label; delete btn.dataset.armed; btn.classList.remove("armed");
}

function reset(){
  found=new Set(); order=[]; wrong=0; wrongWords=[]; hints=0; finished=false;
  renderGrid(); updateStats(); clock.textContent="0:00.0"; say("");
}

function start(){
  reset();
  running=true; startTime=Date.now(); usedAlpha=alphaBox.checked;
  clearInterval(timerId); timerId=setInterval(tick,100);
  guess.disabled=false; guess.value=""; guess.focus();
  $("btnHint").disabled=false; $("btnGiveUp").disabled=false;
  $("btnStart").textContent="Restart";
}

function accept(w){
  found.add(w); order.push(w);
  renderGrid(w);
  guess.value="";
  say(`Got it: ${w}`,"good");
  if(found.size<WORDS.length){ play("good"); bigCue("good","✓ "+w); } flash("good");
  updateStats();
  if(found.size===WORDS.length) finish(true);
}

// Auto-accept only when the typed word can't be the start of another word still missing
function isAmbiguous(t){
  return WORDS.some(w=>w!==t && !found.has(w) && w.startsWith(t));
}
guess.addEventListener("input",()=>{
  if(!running) return;
  const t=guess.value.trim().toLowerCase();
  if(WORDS.includes(t) && !found.has(t) && !isAmbiguous(t)) accept(t);
});
guess.addEventListener("keydown",e=>{
  if(e.key!=="Enter" || !running) return;
  const t=guess.value.trim().toLowerCase();
  if(!t) return;
  if(found.has(t)){ say(`Already have ${t}`,""); guess.value=""; return; }
  if(WORDS.includes(t)){ accept(t); return; }
  wrong++; wrongWords.push(t); guess.value="";
  say(`${t} isn't on the list`,"bad"); updateStats(); play("bad"); flash("bad"); bigCue("bad","✗ "+t);
});

function hint(){
  if(!running) return;
  const counts={};
  WORDS.forEach(w=>{ if(!found.has(w)){ const c=w[0]; counts[c]=(counts[c]||0)+1; } });
  let best=null;
  Object.keys(counts).sort().forEach(c=>{ if(best===null || counts[c]>counts[best]) best=c; });
  if(!best) return;
  hints++; updateStats();
  const n=counts[best];
  say(`Try a word starting with <mark>${best.toUpperCase()}</mark> — ${n} still missing`,"hint");
  guess.focus();
}

function finish(completed){
  running=false; finished=true; clearInterval(timerId);
  const ms=Date.now()-startTime; clock.textContent=fmt(ms);
  ["btnStart","btnGiveUp"].forEach(id=>disarm($(id)));
  guess.disabled=true; $("btnHint").disabled=true; $("btnGiveUp").disabled=true;
  $("btnStart").textContent="Play again";
  const missed=WORDS.filter(w=>!found.has(w));
  renderGrid();
  saveGame({date:new Date().toISOString(), ms, found:found.size, wrong, hints, completed, missed, wrongWords, alpha:usedAlpha});
  // Pet World: tell the game (Today's plan, the Arcade or the unit page) how the round went (docs/ENGLISH-UNIT5.md)
  try{ if(window.parent!==window) window.parent.postMessage({type:"prep:result", result:{ms, found:found.size, wrong, hints, completed, missed, alpha:usedAlpha}}, location.origin); }catch(e){}
  if(completed){ play("win"); bigCue("good","All 48!"); }
  if(completed) say(`All 48 in ${fmt(ms)} with ${wrong} wrong and ${hints} hints.`,"good");
  else say(`Stopped at ${found.size} of 48. The ${missed.length} you missed are shown in red.`,"bad");
}

function giveUp(){ if(running) armed($("btnGiveUp"),"Tap again to give up",()=>{ if(running) finish(false); }); }

// History (browser localStorage, kept on this device)
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ return []; } }
function saveGame(g){
  const h=loadHistory(); h.unshift(g);
  try{ localStorage.setItem(KEY,JSON.stringify(h)); }catch(e){}
  memHistory=h; renderHistory();
}
let memHistory=loadHistory();

function renderHistory(){
  const h=memHistory;
  const done=h.filter(g=>g.completed);
  const pb=done.length? done.reduce((a,b)=>a.ms<=b.ms?a:b):null;
  $("best").textContent = pb
    ? `Best time: ${fmt(pb.ms)} (${pb.wrong} wrong, ${pb.hints} hints) · ${h.length} game${h.length===1?"":"s"} played`
    : (h.length? `${h.length} game${h.length===1?"":"s"} played. Finish all 48 to set a best time.` : "Finish a game to set a best time.");
  if(!h.length){ $("history").innerHTML='<div class="empty">No games yet. Press Start to play your first round.</div>'; return; }
  $("history").innerHTML = `<table><thead><tr><th>Date</th><th>Time</th><th>Found</th><th>Wrong</th><th>Hints</th><th>Blanks</th><th>Result</th><th>Missed / wrong guesses</th></tr></thead><tbody>${
    h.map(g=>{
      const d=new Date(g.date);
      const notes=[g.missed.length?`Missed: ${g.missed.join(", ")}`:"", g.wrongWords&&g.wrongWords.length?`Wrong: ${g.wrongWords.join(", ")}`:""].filter(Boolean).join(" | ")||"—";
      return `<tr class="${g===pb?"pb":""}"><td>${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</td><td class="num">${fmt(g.ms)}</td><td class="num">${g.found}/48</td><td class="num">${g.wrong}</td><td class="num">${g.hints}</td><td>${g.alpha?"A to Z":"Any order"}</td><td>${g.completed?"Finished":"Gave up"}</td><td class="notes">${notes}</td></tr>`;
    }).join("")
  }</tbody></table>`;
}

function downloadCsv(){
  const rows=[["date","time_seconds","found","wrong","hints","blanks","result","missed","wrong_guesses"]];
  memHistory.forEach(g=>rows.push([g.date,(g.ms/1000).toFixed(1),g.found,g.wrong,g.hints,g.alpha?"alphabetical":"any order",g.completed?"finished":"gave up",g.missed.join(" "),(g.wrongWords||[]).join(" ")]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="preposition-history.csv"; a.click();
}
function clearHistory(){ armed($("btnClear"),"Tap again to delete all",doClear); }
function doClear(){
  try{ localStorage.removeItem(KEY); }catch(e){}
  memHistory=[]; renderHistory();
}

$("btnStart").onclick=()=>{ if(running) armed($("btnStart"),"Tap again to restart",start); else start(); };
$("btnHint").onclick=hint;
alphaBox.addEventListener("change",()=>{
  try{ localStorage.setItem(PREF, alphaBox.checked?"1":"0"); }catch(e){}
  if(running && alphaBox.checked) usedAlpha=true;
  renderGrid(); if(running) guess.focus();
});
$("btnGiveUp").onclick=giveUp;
$("btnCsv").onclick=downloadCsv;
$("btnClear").onclick=clearHistory;

reset(); renderHistory();
</script>
</body>
</html>
