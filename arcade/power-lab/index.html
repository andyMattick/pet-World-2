<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Punctuation Power Lab</title>
<!-- Pet World Arcade copy of the ⚡ Punctuation Power Lab (English Unit 6, docs/ENGLISH-UNIT6.md, docs/ARCADE-GAMES.md).
     Served at /arcade/power-lab/. It is a Vite page (vite.config.ts), not a public/ file, so it uses the same missions as
     the unit: src/game/heroLab.js. In the Arcade (?arcadeRun=…) it pays tickets; it never pays coins or counts toward
     the unit's stars, quizzes or tests. -->
<style>
  :root{ --bg:#FDE8EE; --surface:#FFFFFF; --ink:#4A2E2A; --ink-soft:#7A5A55; --edge:#4A2E2A; --berry:#E4577A; --berry-deep:#B83659; --butter:#FFD76A; --dot:#F7D2DD; --ok:#2E7D57; --bad:#B83659; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#2A1B24; --surface:#3B2833; --ink:#FBE9F0; --ink-soft:#D8B9C6; --edge:#120A0F; --berry:#EE7394; --berry-deep:#FF9DB6; --butter:#6B5520; --dot:#4A3340; --ok:#7FD1B9; --bad:#FF9DB6; } }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif}
  button{font:inherit; color:inherit; cursor:pointer}
  .wrap{max-width:760px; margin:0 auto; padding:12px 16px 32px}
  h1{font-size:1.7em; margin:6px 0 4px} h2{font-size:1.2em; margin:0 0 6px}
  .muted{color:var(--ink-soft)}
  .card{background:var(--surface); border:3px solid var(--edge); border-radius:16px; padding:14px; margin-top:12px}
  .btn{border:3px solid var(--edge); background:var(--surface); border-radius:12px; padding:8px 14px; font-weight:700}
  .btn.go{background:var(--berry); color:#fff; border-color:var(--berry-deep)}
  .packs{display:grid; gap:10px}
  .pack{display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:3px solid var(--edge); background:var(--surface); border-radius:14px; padding:10px 12px}
  .pack .e{font-size:1.8em} .pack b{display:block}
  .ask{font-size:1.05em}
  .sentence{font-size:1.45em; line-height:2; margin:10px 0 4px}
  .spot{font:inherit; font-weight:800; min-width:1.6em; padding:0 .3em; margin:0 1px; border:3px dashed var(--berry); border-radius:10px; background:var(--butter); color:var(--ink); animation:glow 1.6s ease-in-out infinite}
  .spot.empty{color:var(--ink-soft)}
  @keyframes glow{50%{box-shadow:0 0 0 5px rgba(228,87,122,.25)}}
  @media (prefers-reduced-motion: reduce){ .spot{animation:none} }
  .filled{color:var(--berry-deep)}
  .hero{display:flex; gap:14px; align-items:center; margin:10px 0; padding:12px 14px; border:3px solid var(--edge); border-radius:16px; background:var(--surface)}
  .hero{flex-wrap:wrap} .hero .emoji{font-size:2.6em; line-height:1.1; max-width:100%; word-break:break-all} .hero > div:last-child{flex:1 1 180px} .hero p{margin:4px 0 0}
  .hero.small{padding:6px 10px; margin:4px 0} .hero.small .emoji{font-size:1.6em}
  .mood-alarm{background:#FFE1D6} .mood-villain{background:#E9D7FF} .mood-friendly{background:#DDF5EA} .mood-curious{background:#E0EEFF} .mood-proud{background:#FFF1C2} .mood-sad{background:#E6E6EE} .mood-glitch{background:#EDEDED}
  @media (prefers-color-scheme: dark){ .hero[class*="mood-"]{background:var(--surface)} }
  .msg{font-weight:700} .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .version{border-top:2px dashed var(--dot); padding:6px 0} .version.goal p{font-weight:700}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import { HERO_PACKS, missionsIn, heroKey, heroOutcome, startChoices } from '../../src/game/heroLab.js';
import { starsFor } from '../../src/game/grammarGames.js';
const params = new URLSearchParams(location.search), ARCADE_RUN = params.get('arcadeRun') || '';
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let best = {}; try { best = JSON.parse(localStorage.getItem('power-lab:best') || '{}') || {}; } catch(e){}
const stars = n => `${'⭐'.repeat(n)}${'☆'.repeat(3 - n)}`;
let run = null;

function heroHTML(m, choices, big = true){
  const h = heroOutcome(m, choices);
  return `<div class="hero mood-${h.mood}${big ? '' : ' small'}"><div class="emoji" aria-hidden="true">${h.emoji}</div><div><b>${esc(h.name)}</b><p>${esc(h.text)}</p></div></div>`;
}
function sentenceHTML(m, choices, live){
  return m.text.split(/(\{\d\})/).map(part => {
    const k = part.match(/^\{(\d)\}$/); if (!k) return esc(part);
    const i = +k[1], c = choices[i];
    return live ? `<button type="button" class="spot${c ? '' : ' empty'}" data-spot="${i}" aria-label="Spot ${i + 1}: ${c ? esc(c) : 'nothing'}. Tap to change.">${c ? esc(c) : '◌'}</button>` : `<b class="filled">${esc(c)}</b>`;
  }).join('');
}
function renderPacks(){
  run = null;
  app.innerHTML = `<h1>⚡ Punctuation Power Lab</h1>
    <p class="muted">Welcome to the Superhero Factory! Tap the glowing spots to change the punctuation, and watch your hero change. Build the hero each mission needs.</p>
    <div class="packs">${HERO_PACKS.map(p => `<button type="button" class="pack" data-pack="${p.id}"><span class="e">${p.emoji}</span><span><b>${esc(p.name)}</b><span class="muted">${missionsIn(p.id).length} missions · ${best[p.id] ? stars(best[p.id]) : 'Not played yet'}</span></span></button>`).join('')}</div>`;
}
function start(pack){
  const list = missionsIn(pack);
  run = {pack, list, i:0, choices:startChoices(list[0]), tries:0, first:0, msg:'', ok:false, reveal:false, done:false};
  render();
}
function render(){
  const r = run, pack = HERO_PACKS.find(p => p.id === r.pack), total = r.list.length;
  let body;
  if (r.done) {
    body = `<div class="card"><h2>🏁 ${stars(r.stars)} ${r.first} of ${total} missions on the first launch</h2>
      <p>${r.stars === 3 ? 'Every hero built perfectly. The city is safe!' : r.stars === 2 ? 'So close to three stars. Try again?' : 'Every mission makes you a stronger punctuation hero. Try again for more stars!'}</p>
      <div class="row"><button type="button" class="btn go" data-again>🔁 Play again</button><button type="button" class="btn" data-packs>Pick another pack</button></div></div>`;
  } else {
    const m = r.list[r.i];
    const versions = r.reveal ? `<details open><summary>👀 Every version of this sentence</summary>${Object.keys(m.outcomes).map(key => { const ch = key.split('|');
      return `<div class="version${key === m.goal ? ' goal' : ''}"><p>${key === m.goal ? '🎯 ' : ''}${sentenceHTML(m, ch, false)}</p>${heroHTML(m, ch, false)}</div>`; }).join('')}</details>` : '';
    body = `<div class="card"><p><b>Mission ${r.i + 1} of ${total}</b> · ⭐ ${r.first} on the first launch</p>
      <p class="ask">🎯 <b>Mission:</b> ${esc(m.mission)}</p>
      <p class="sentence">${sentenceHTML(m, r.choices, !r.reveal)}</p>
      ${r.reveal ? '' : '<p class="muted" style="margin:0">Tap a glowing spot to change it. Your hero changes too!</p>'}
      ${heroHTML(m, r.choices)}
      ${r.msg ? `<p class="msg ${r.ok ? 'ok' : 'bad'}" role="status">${r.msg}</p>` : ''}
      <div class="row">${r.reveal ? `<button type="button" class="btn go" data-next>${r.i + 1 < total ? 'Next mission' : 'Finish'}</button>` : '<button type="button" class="btn go" data-launch>🚀 Launch!</button>'}</div>
      ${versions}</div>`;
  }
  app.innerHTML = `<div class="row"><h1 style="flex:1">⚡ Punctuation Power Lab</h1><button type="button" class="btn" data-packs>All packs</button></div><p class="muted">${pack.emoji} ${esc(pack.name)}</p>${body}`;
}
function finish(){
  const r = run, total = r.list.length;
  r.stars = starsFor(r.first, total); r.done = true;
  best[r.pack] = Math.max(best[r.pack] || 0, r.stars); try { localStorage.setItem('power-lab:best', JSON.stringify(best)); } catch(e){}
  try { if (ARCADE_RUN && window.parent !== window) window.parent.postMessage({type:'arcade:round-complete', gameId:'power-lab', runId:ARCADE_RUN, roundId:`${r.pack}-${Date.now()}`, score:r.first}, location.origin); } catch(e){}
}
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pack) { start(b.dataset.pack); return; }
  if (b.hasAttribute('data-packs')) { renderPacks(); return; }
  const r = run; if (!r) return;
  if (b.hasAttribute('data-again')) { start(r.pack); return; }
  if (b.dataset.spot != null && !r.reveal) {
    const m = r.list[r.i], i = +b.dataset.spot, opts = m.spots[i];
    r.choices[i] = opts[(opts.indexOf(r.choices[i]) + 1) % opts.length]; r.msg = '';
    render(); app.querySelector(`[data-spot="${i}"]`)?.focus(); return;
  }
  if (b.hasAttribute('data-launch')) {
    const m = r.list[r.i];
    if (heroKey(r.choices) === m.goal) { if (!r.tries) r.first++; r.ok = true; r.reveal = true; r.msg = `✅ ${r.tries ? 'Mission complete!' : 'First launch! Mission complete!'} ${esc(heroOutcome(m, r.choices).name)} is ready.`; }
    else if (++r.tries >= 2) { r.choices = m.goal.split('|'); r.ok = false; r.reveal = true; r.msg = 'Not quite. Here’s the hero this mission needed. Look at every version below to see what each mark does.'; }
    else { r.ok = false; r.msg = 'Your hero isn’t doing the mission yet. Read the mission again and try another mark!'; }
    render(); return;
  }
  if (b.hasAttribute('data-next')) {
    r.i++; r.tries = 0; r.msg = ''; r.ok = false; r.reveal = false;
    if (r.i >= r.list.length) finish(); else r.choices = startChoices(r.list[r.i]);
    render();
  }
});
renderPacks();
</script>
</body>
</html>
